<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-purple-500 to-indigo-500 flex items-center justify-center">

<div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">

    <!-- Heading -->
    <div class="flex flex-col items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800 mt-4">
            Welcome Back
        </h1>

        <p class="text-gray-500 mt-1">
            Sign in to your account
        </p>
        <p class="text-green-500 mt-3" th:if="${param.logout}">
            Logout Successfully
        </p>
        <p class="text-red-500 mt-3" th:if="${param.error}">
            Invalid Login Detail
        </p>
    </div>

    <!-- Login Form -->
    <form th:action="@{/do-login}" method="post">

        <!-- Username -->
        <div class="mb-4">
            <label for="username"
                   class="block text-gray-700 font-medium mb-2">
                Username
            </label>

            <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>

        <!-- Password -->
        <div class="mb-6">
            <label for="password"
                   class="block text-gray-700 font-medium mb-2">
                Password
            </label>

            <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-purple-500">
        </div>

        <!-- Login Button -->
        <button
                type="submit"
                class="w-full bg-purple-600 text-white py-2 rounded-lg
                       font-semibold hover:bg-purple-700 transition duration-200">
            Login
        </button>

    </form>

</div>

</body>
</html>
