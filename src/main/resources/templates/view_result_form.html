<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<nav class="bg-white shadow-md sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-6">
    <div class="flex justify-between items-center h-16">

      <!-- Logo -->
      <a href="#" class="text-2xl font-bold text-blue-600">
        Result Viewer
      </a>

      <!-- Desktop Menu -->
      <div class="hidden md:flex items-center space-x-8">
        <a th:href="@{'/'}" href="#" class="text-gray-700 hover:text-blue-600 transition">Home</a>
        <a th:href="@{'/view-result'}" href="#" class="text-gray-700 hover:text-blue-600 transition">View Result</a>
        <a th:href="@{'/admin/add-result'}" href="#" class="text-gray-700 hover:text-blue-600 transition">Add Result</a>
        <a th:href="@{'/help'}" href="#" class="text-gray-700 hover:text-blue-600 transition">Help</a>
      </div>

      <!-- Mobile Button -->
      <button id="menu-btn" class="md:hidden text-gray-700 focus:outline-none">
        <svg xmlns="http://www.w3.org/2000/svg"
             class="h-7 w-7"
             fill="none"
             viewBox="0 0 24 24"
             stroke="currentColor">

          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>

    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden md:hidden pb-4">

      <a href="#" class="block py-2 text-gray-700 hover:text-blue-600">
        Home
      </a>

      <a href="#" class="block py-2 text-gray-700 hover:text-blue-600">
        View Result
      </a>

      <a href="#" class="block py-2 text-gray-700 hover:text-blue-600">
        Add Result
      </a>

      <a href="#" class="block py-2 text-gray-700 hover:text-blue-600">
        Help
      </a>

    </div>
  </div>
</nav>


<div class="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-50 flex items-center justify-center px-4">

  <div class="w-full max-w-md">

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="mx-auto mb-4 w-14 h-14 rounded-full bg-blue-100 flex items-center justify-center">
          <svg class="w-7 h-7 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h6l5 5v11a2 2 0 01-2 2z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                  d="M13 3v5h5"/>
          </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-900">
          Check Your Result
        </h1>

        <p class="mt-2 text-sm text-gray-500">
          Enter your roll number and date of birth to view your result.
        </p>
      </div>

      <!-- Form -->
      <form class="space-y-5" th:action="@{'/view-result-action'}" th:object="${requestResultForm}" method="post">

        <!-- Roll Number -->
        <div>
          <label for="rollNumber" class="block text-sm font-medium text-gray-700 mb-2">
            Roll Number
          </label>

          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor"
                   viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                      d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
                <rect x="9" y="3" width="6" height="4" rx="1"
                      stroke-width="1.8"/>
              </svg>
            </div>

            <input
                    th:field="*{rollNumber}"
                    type="text"
                    id="rollNumber"
                    name="rollNumber"
                    placeholder="Enter your roll number"
                    class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200
                                   bg-gray-50 text-gray-900 placeholder-gray-400
                                   outline-none transition
                                   focus:bg-white focus:border-blue-500
                                   focus:ring-4 focus:ring-blue-100"
                    required
            >
            <span class="text-red-700 p2" th:if="${#fields.hasErrors('rollNumber')}" th:errors="*{rollNumber}"></span>
          </div>
        </div>

        <!-- Date of Birth -->
        <div>
          <label for="dob" class="block text-sm font-medium text-gray-700 mb-2">
            Date of Birth
          </label>

          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor"
                   viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"
                      d="M8 2v4m8-4v4M3 10h18M5 5h14a2 2 0 012 2v13a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2z"/>
              </svg>
            </div>

            <input
                    th:field="*{dateOfBirth}"
                    type="date"
                    id="dob"
                    name="dob"
                    class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200
                                   bg-gray-50 text-gray-900
                                   outline-none transition
                                   focus:bg-white focus:border-blue-500
                                   focus:ring-4 focus:ring-blue-100"
                    required
            >
            <span class="text-red-700 p2" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
          </div>
        </div>

        <!-- Submit -->
        <button
                type="submit"
                class="w-full py-3.5 px-4 rounded-xl
                           bg-blue-600 hover:bg-blue-700
                           active:bg-blue-800
                           text-white font-semibold
                           shadow-lg shadow-blue-200
                           transition-all duration-200
                           hover:-translate-y-0.5
                           focus:outline-none focus:ring-4 focus:ring-blue-200">
          View Result
        </button>

      </form>

      <!-- Footer -->
      <p class="text-center text-xs text-gray-400 mt-6">
        Please enter the details exactly as registered.
      </p>

    </div>

    <p class="text-center text-sm text-gray-400 mt-5">
      © 2026 Student Result Portal
    </p>

  </div>
</div>




</body>
</html>
